<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маша едет за границу — экспортный потенциал российской анимации</title>
  <meta name="description" content="Мультимедийный лонгрид: почему российская анимация продаётся лучше российского кино и хватит ли этого, чтобы удержать экспорт.">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Маша едет за границу">
  <meta property="og:description" content="Почему российская анимация продаётся лучше российского кино — и хватит ли этого, чтобы удержать экспорт.">
  <meta name="theme-color" content="#141B2D">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к тексту</a>
  <div class="bg" aria-hidden="true"></div>
  <nav class="rail" id="rail" aria-label="Маршрут по статье"></nav>

  <main id="main">
    <section class="stop stop--cover" id="s0" data-stop="0" aria-labelledby="s0-h"></section>
    <div class="transit" data-transit="tear" aria-hidden="true"></div>
    <section class="stop" id="s1" data-stop="1"></section>
    <div class="transit" data-transit="route" aria-hidden="true"></div>
    <section class="stop" id="s2" data-stop="2"></section>
    <div class="transit" data-transit="zoom" aria-hidden="true"></div>
    <section class="stop" id="s3" data-stop="3"></section>
    <div class="transit" data-transit="flip" aria-hidden="true"></div>
    <section class="stop" id="s4" data-stop="4"></section>
    <div class="transit" data-transit="scatter" aria-hidden="true"></div>
    <section class="stop" id="s5" data-stop="5"></section>
    <div class="transit" data-transit="suitcase" aria-hidden="true"></div>
    <section class="stop" id="s6" data-stop="6"></section>
    <div class="transit" data-transit="route2" aria-hidden="true"></div>
    <section class="stop" id="s7" data-stop="7"></section>
    <div class="transit" data-transit="landing" aria-hidden="true"></div>
    <section class="stop" id="s8" data-stop="8"></section>
  </main>
  <footer class="sources" id="s9" data-stop="9" aria-labelledby="s9-h"></footer>

  <div class="fn-tip" id="fn-tip" role="tooltip" hidden></div>
  <noscript><p style="padding:24px">Для просмотра лонгрида включите JavaScript.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
